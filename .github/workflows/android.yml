name: Android APK
on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid setup-android's deprecated "tools" package installation.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PrivateDNSSwitch.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateDNSSwitch-apk
          path: PrivateDNSSwitch.apk
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PrivateDNSSwitch.apk
          generate_release_notes: true
